name: CI

permissions:
  contents: read

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f "agora_requirements.txt" ]; then pip install -r agora_requirements.txt; fi
      - name: Install flake8
        run: python -m pip install flake8
      - name: Run flake8
        run: flake8 .
      - name: Run Pytest
        run: pytest -q

  node-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install and audit
        run: |
          if [ -f package.json ]; then npm ci || npm install; npm audit --audit-level=high || true; fi
      - name: Run ESLint
        run: |
          if [ -f package.json ]; then npx eslint . --ext .js; fi
