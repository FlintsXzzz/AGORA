name: Automated npm audit fix

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # weekly on Monday at 03:00 UTC

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run npm audit fix (may upgrade majors)
        run: npm audit fix --force || true
      - name: Create Pull Request for fixes
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: npm audit fix (automated)"
          branch: "automated/npm-audit-fix-${{ github.run_id }}"
          title: "Automated: npm audit fix results"
          body: |-
            This PR contains automated dependency fixes produced by `npm audit fix --force`.
            Please review the changelog for breaking changes and run tests before merging.
          labels: automated, dependencies
