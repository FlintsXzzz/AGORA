services:
  agora:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: ["node", "index.js"]
    environment:
      NODE_ENV: production
      AI_ENGINE_BASE_URL: http://ai-engine:8000
      WWEBJS_SESSION_DIR: /app/.wwebjs_auth
    ports:
      - "3000:3000"
    depends_on:
      - ai-engine
    restart: unless-stopped

  ai-engine:
    build:
      context: .
      dockerfile: Dockerfile.ai-engine
    working_dir: /app
    env_file:
      - ./.env
    environment:
      AGORA_STORAGE_DIR: /app/storage
      DATABASE_URL: postgresql://postgres:agora@postgres:5432/agora
    ports:
      - "8000:8000"
    volumes:
      - agora-storage:/app/storage
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: agora
      POSTGRES_DB: agora
    ports:
      - "5432:5432"
    volumes:
      - agora-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  agora-debug:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      NODE_ENV: development
      DEBUG: "true"
      AI_ENGINE_BASE_URL: http://ai-engine:8000
      WWEBJS_SESSION_DIR: /app/.wwebjs_auth
    command: ["node", "--inspect=0.0.0.0:9229", "index.js"]
    ports:
      - "3000:3000"
      - "9229:9229"
    depends_on:
      - ai-engine
    restart: unless-stopped
    profiles:
      - debug

volumes:
  agora-storage:
  agora-postgres-data:
